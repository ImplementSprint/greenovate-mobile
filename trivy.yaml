# Trivy configuration file to resolve monorepo scanning issues
# without modifying the GitHub Actions pipeline.

scan:
  # Skip directories that cause issues due to missing node_modules in CI
  skip-dirs:
    - "central-perk"
    - "nexOOS"
    - "shelf-awareness/ScannerApp"

license:
  # Disable license scanning as it requires npm install / node_modules
  # which are not available during the security scan step in the monorepo.
  full: false
