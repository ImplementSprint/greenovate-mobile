# Multi-stack mobile template Sonar configuration
sonar.projectName=greenovate-mobile
# Only scan the actual source code folders to avoid Security Hotspots in manifests/configs
sonar.sources=shelf-awareness/app,shelf-awareness/components,shelf-awareness/services,shelf-awareness/utils,nexus/app/src/main/java,nexus/app/src/main/kotlin
sonar.tests=shelf-awareness/tests,nexus/app/src/test
sonar.exclusions=**/node_modules/**,**/build/**,**/.gradle/**,**/coverage/**,**/*.xml,**/*.plist,**/*.xcprivacy
sonar.test.inclusions=**/*test*/**,**/*Test*/**
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=xml:S5604
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.xml
